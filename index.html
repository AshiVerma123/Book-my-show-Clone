<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./styles.css">
</head>
<body>
    <!-- header -->
    
    <header>

        <div class="head">

            <!-- logo -->
            <div class="logo">
                <div class="left">
                    <h1>BookMyShow</h1>
                </div>
                <div class="right">
                        <button>Movies</button
                        ><button>Events</button>
                        <button>Sports</button>
                        <button>More</button>
                </div>
            </div>
            <!-- search -->
            <div class="search">

                <input type="text" class="searching" placeholder="search for movies, events and sports...">
                <button>Search</button>

            </div>

        </div>

    </header>



    <!-- main -->
    <main>
    <!-- hero section -->
    <div class="hero">
        <h2>Experience the Best Movies and Events</h2>
        <button>Book Now</button>
    </div>

    <div class="mover">
        <h2>Popular Movies</h2>
    </div>

    <div class="movie">

        <!-- card 1 -->
        <div class="card  bill">
            <img src="./img1.avif" alt="Singham" class="images">
            <h3>Singham</h3>
        </div>

        <!-- card 2 -->
        <div class="card">
            <img src="./img2.avif" alt="Singham" class="images">
            <h3>Bhool Bhulaiya 2</h3>
        </div>

        <!-- card 3 -->
        <div class="card">
            <img src="./img3.avif" alt="Singham" class="images">
            <h3>Venom</h3>
        </div>

        <!-- card 4 -->
        <div class="card">
            <img src="./img4.avif" alt="Singham" class="images">
            <h3>Vicky Vidya</h3>
        </div>

        <!-- card 5 -->
        <div class="card">
            <img src="./img5.avif" alt="Singham" class="images">
            <h3>Jigra</h3>
        </div>

        <!-- card 6 -->
        <div class="card">
            <img src="./img6.avif" alt="Singham" class="images">
            <h3>Bandaa Singh</h3>
        </div>

        <!-- card 7 -->
        <div class="card">
            <img src="./img7.avif" alt="Singham" class="images">
            <h3>Amaran</h3>
        </div>


    </div>

    <div class="bot">

        <img src="./bottom.avif">

    </div>

    </main>

</body>
</html>
